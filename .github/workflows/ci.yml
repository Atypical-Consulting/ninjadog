name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Ninjadog.CLI embarque WebUI/dist/** en EmbeddedResource, et dist/ est
      # committé. Un bump de dépendance JS ne change donc RIEN de ce qui est
      # livré tant que le bundle n'est pas régénéré — la CI reste verte et la
      # vulnérabilité reste dans le binaire. Mesuré le 2026-07-26 : dist/ datait
      # du 15 mars alors que package.json avait été bumpé depuis.
      # Cette étape reconstruit le bundle et échoue s'il diffère du committé.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/tools/Ninjadog.CLI/WebUI/package-lock.json

      - name: Rebuild WebUI bundle
        working-directory: src/tools/Ninjadog.CLI/WebUI
        run: |
          npm ci
          npm run build

      - name: Verify the committed WebUI bundle is up to date
        run: |
          # --porcelain couvre aussi les fichiers NON SUIVIS : vite nomme ses
          # assets par hash, donc un bundle modifié apparaît comme une
          # suppression + un ajout non suivi, que `git diff` seul ne voit pas.
          changes=$(git status --porcelain -- src/tools/Ninjadog.CLI/WebUI/dist)
          if [ -n "$changes" ]; then
            echo "::error::WebUI/dist est périmé : il ne correspond plus aux sources ni au lockfile."
            echo "Correctif : npm ci && npm run build dans src/tools/Ninjadog.CLI/WebUI, puis committer dist/."
            echo "$changes"
            exit 1
          fi
          echo "dist/ est à jour."

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh src/tests/Ninjadog.Tests.E2E/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
